name: Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      working-directory:
        required: true
        type: string

      workspace:
        required: true
        type: string

      apply:
        required: true
        type: boolean


jobs:

  # ==========================================================
  # VALIDATE
  # ==========================================================

  validate:
    name: Validate ${{ inputs.environment }}

    runs-on: ubuntu-latest

    steps:
      - name: Fake Terraform Validate
        shell: bash
        run: |
          echo "=========================================="
          echo "TERRAFORM VALIDATE"
          echo "=========================================="
          echo "Environment : ${{ inputs.environment }}"
          echo "Directory   : ${{ inputs.working-directory }}"
          echo "Workspace   : ${{ inputs.workspace }}"
          echo

          # Different duration so it is easy to see
          # that environments are independent.
          case "${{ inputs.environment }}" in
            dev)
              sleep 2
              ;;
            qa)
              sleep 5
              ;;
            prod)
              sleep 10
              ;;
          esac

          echo "terraform init"
          echo "terraform validate"
          echo
          echo "VALIDATE SUCCESSFUL"


  # ==========================================================
  # PLAN
  # ==========================================================

  plan:
    name: Plan ${{ inputs.environment }}

    needs:
      - validate

    runs-on: ubuntu-latest

    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}

    steps:
      - name: Fake Terraform Plan
        id: plan
        shell: bash
        run: |
          echo "=========================================="
          echo "TERRAFORM PLAN"
          echo "=========================================="
          echo "Environment : ${{ inputs.environment }}"
          echo "Directory   : ${{ inputs.working-directory }}"
          echo "Workspace   : ${{ inputs.workspace }}"
          echo

          sleep 3

          echo "terraform plan"
          echo
          echo "Plan:"
          echo "  + 2 to add"
          echo "  ~ 1 to change"
          echo "  - 0 to destroy"

          RUN_ID="fake-run-${{ inputs.environment }}-${{ github.run_id }}"

          echo
          echo "Fake Terraform Cloud run ID: $RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # APPLY
  # ==========================================================

  apply:
    name: Apply ${{ inputs.environment }}

    needs:
      - plan

    if: inputs.apply

    runs-on: ubuntu-latest

    # GitHub Environment controls approval.
    #
    # dev  -> no reviewers
    # qa   -> required reviewer
    # prod -> required reviewer
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Fake Terraform Apply
        shell: bash
        run: |
          echo "=========================================="
          echo "TERRAFORM APPLY"
          echo "=========================================="
          echo "Environment : ${{ inputs.environment }}"
          echo "Directory   : ${{ inputs.working-directory }}"
          echo "Workspace   : ${{ inputs.workspace }}"
          echo
          echo "Run ID:"
          echo "${{ needs.plan.outputs.run_id }}"
          echo

          sleep 3

          echo "terraform apply"
          echo
          echo "APPLY SUCCESSFUL"
