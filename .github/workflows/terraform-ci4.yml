name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ matrix.environment }}

    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","qa","prod"]') }}

    uses: ./.github/workflows/terraform-environment.yml

    with:
      environment: ${{ matrix.environment }}

    secrets: inherit
